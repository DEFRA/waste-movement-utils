name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: |
          npm audit --audit-level=high --omit=dev
          npm audit --audit-level=critical
          npm ci  --legacy-peer-deps
          npm run format:check
          npm run lint
          npm test

      - name: Get package version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if version exists on npm
        id: check-version
        run: |
          if npm view @defra/waste-movement-utils@${{ steps.package-version.outputs.version }} version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check-version.outputs.exists == 'false'
        run: npm publish --access public

      # Runs last, so nothing here can stop a release of the library. A Defra npm
      # org admin publishes a new package name first, and until then this skips
      - name: Publish the reference data package if its version is not on npm
        working-directory: packages/reference-data
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if ! lookup=$(npm view "$name" name 2>&1); then
            grep -q "code E404" <<< "$lookup" || { echo "$lookup"; exit 1; }
            echo "::notice::$name is not on npm yet, so $version is not published"
          elif npm view "$name@$version" version 2>/dev/null; then
            echo "$name@$version is already on npm"
          else
            npm publish --access public
          fi
