name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: |
          npm audit --audit-level=high --omit=dev
          npm audit --audit-level=critical
          npm ci  --legacy-peer-deps
          npm run format:check
          npm run lint
          npm test

      # The packages publish before the umbrella at the root, which pins them,
      # and the first failure stops the loop
      - name: Publish each version that is not on npm
        run: |
          for folder in packages/reference-data packages/http-errors packages/service .; do
            name=$(node -p "require('./$folder/package.json').name")
            version=$(node -p "require('./$folder/package.json').version")
            if npm view "$name@$version" version 2>/dev/null; then
              echo "$name@$version is already on npm"
            else
              npm publish "./$folder" --access public
            fi
          done
